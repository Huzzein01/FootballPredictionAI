<!DOCTYPE html>
<html lang="en" data-context="international">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Football Analyst — Immersive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/immersive.css?v=8" />
  <link rel="stylesheet" href="/v2/immersive-2.css?v=8" />
</head>
<body>

  <!-- ── Splash: striker, ball arc, net shake, scoreboard ── -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-sky"></div>
    <div class="splash-floods">
      <span class="flood flood-1"></span><span class="flood flood-2"></span>
      <span class="flood flood-3"></span><span class="flood flood-4"></span>
    </div>
    <div class="splash-stage">
      <svg class="pitch-scene" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c5a2e"/><stop offset="1" stop-color="#073d20"/>
          </linearGradient>
          <radialGradient id="spot" cx="0.5" cy="0.2" r="0.9">
            <stop offset="0" stop-color="rgba(255,175,60,0.14)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>
        <rect x="0" y="300" width="1000" height="260" fill="url(#grass)"/>
        <g opacity="0.5">
          <rect x="0" y="300" width="1000" height="26" fill="#0e6633"/>
          <rect x="0" y="352" width="1000" height="26" fill="#0e6633"/>
          <rect x="0" y="404" width="1000" height="26" fill="#0e6633"/>
          <rect x="0" y="456" width="1000" height="26" fill="#0e6633"/>
          <rect x="0" y="508" width="1000" height="26" fill="#0e6633"/>
        </g>
        <ellipse cx="500" cy="250" rx="620" ry="200" fill="url(#spot)"/>
        <g class="goal">
          <g class="net" stroke="rgba(255,255,255,0.32)" stroke-width="1.4">
            <path d="M760 150 L940 150 L940 350 L760 350 Z" fill="rgba(255,255,255,0.04)"/>
            <line x1="780" y1="150" x2="780" y2="350"/><line x1="800" y1="150" x2="800" y2="350"/>
            <line x1="820" y1="150" x2="820" y2="350"/><line x1="840" y1="150" x2="840" y2="350"/>
            <line x1="860" y1="150" x2="860" y2="350"/><line x1="880" y1="150" x2="880" y2="350"/>
            <line x1="900" y1="150" x2="900" y2="350"/><line x1="920" y1="150" x2="920" y2="350"/>
            <line x1="760" y1="175" x2="940" y2="175"/><line x1="760" y1="205" x2="940" y2="205"/>
            <line x1="760" y1="235" x2="940" y2="235"/><line x1="760" y1="265" x2="940" y2="265"/>
            <line x1="760" y1="295" x2="940" y2="295"/><line x1="760" y1="325" x2="940" y2="325"/>
          </g>
          <g stroke="#f4f7ff" stroke-width="7" stroke-linecap="round" fill="none">
            <line x1="758" y1="148" x2="758" y2="352"/><line x1="758" y1="148" x2="942" y2="148"/><line x1="942" y1="148" x2="942" y2="352"/>
          </g>
        </g>
        <g class="ball"><circle r="15" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="1.5"/><path d="M0 -8 L7 -2 L4 7 L-4 7 L-7 -2 Z" fill="#111"/></g>
        <g class="striker" transform="translate(180,300)">
          <g class="player">
            <ellipse class="shadow" cx="0" cy="120" rx="40" ry="9" fill="rgba(0,0,0,0.35)"/>
            <circle cx="0" cy="-86" r="15" fill="#0b0d12"/>
            <rect x="-13" y="-72" width="26" height="58" rx="11" fill="#0b0d12"/>
            <g class="arm-back" transform="translate(-10,-66)"><rect x="-6" y="0" width="11" height="40" rx="5" fill="#10131a"/></g>
            <g class="arm-front" transform="translate(10,-66)"><rect x="-5" y="0" width="11" height="40" rx="5" fill="#10131a"/></g>
            <g class="leg-plant" transform="translate(-6,-16)"><rect x="-7" y="0" width="14" height="62" rx="7" fill="#0b0d12"/></g>
            <g class="leg-kick" transform="translate(8,-16)"><rect x="-7" y="0" width="14" height="60" rx="7" fill="#0b0d12"/><rect x="-9" y="54" width="26" height="11" rx="5" fill="#7a1a2a"/></g>
          </g>
        </g>
        <circle class="strike-flash" cx="235" cy="356" r="0" fill="rgba(255,190,70,0.9)"/>
      </svg>
      <div class="scoreboard" aria-hidden="true">
        <span class="sb-team sb-home">MODEL</span>
        <span class="sb-score"><b class="sb-h">0</b><i>:</i><b class="sb-a">0</b></span>
        <span class="sb-team sb-away">ODDS</span>
      </div>
      <div class="goal-flash">GOAL!</div>
      <div class="splash-brand">
        <div class="brand-mark">⚽</div>
        <h1>FOOTBALL ANALYST</h1>
        <p>Immersive prediction engine</p>
        <div class="splash-loadbar"><span></span></div>
      </div>
    </div>
    <button id="skipSplash" class="skip-splash" type="button">Skip ›</button>
  </div>

  <!-- ── App shell ── -->
  <div id="app" class="app" hidden>
    <header class="hero">
      <!-- Immersive looping stadium scene -->
      <div class="hero-scene" id="heroScene" aria-hidden="true">
        <div class="hs-sky"></div>
        <div class="hs-stands"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="hs-flood hs-flood-l"></div>
        <div class="hs-flood hs-flood-r"></div>
        <div class="hs-particles" id="hsParticles"></div>
        <!-- 3D perspective pitch: top-down SVG + CSS rotateX = broadcast camera angle -->
        <div class="hs-3d-wrap" aria-hidden="true">
          <svg class="hs-3d-svg" viewBox="0 0 800 580" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="hgrass3d" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0a6030"/><stop offset="1" stop-color="#0e7d3a"/>
              </linearGradient>
              <radialGradient id="fog3d" cx="0.5" cy="0" r="0.9" gradientUnits="objectBoundingBox">
                <stop offset="0%" stop-color="rgba(12,4,4,0.68)"/>
                <stop offset="75%" stop-color="rgba(12,4,4,0)"/>
              </radialGradient>
            </defs>
            <!-- Grass surface -->
            <rect x="0" y="0" width="800" height="580" fill="url(#hgrass3d)"/>
            <!-- Mow stripes -->
            <rect x="0" y="0"   width="800" height="58"  fill="rgba(0,0,0,0.08)"/>
            <rect x="0" y="116" width="800" height="58"  fill="rgba(0,0,0,0.08)"/>
            <rect x="0" y="232" width="800" height="58"  fill="rgba(0,0,0,0.08)"/>
            <rect x="0" y="348" width="800" height="58"  fill="rgba(0,0,0,0.08)"/>
            <rect x="0" y="464" width="800" height="58"  fill="rgba(0,0,0,0.08)"/>
            <!-- Pitch boundary -->
            <rect x="30" y="14" width="740" height="552" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="2.5"/>
            <!-- Halfway line -->
            <line x1="30" y1="290" x2="770" y2="290" stroke="rgba(255,255,255,0.72)" stroke-width="2.5"/>
            <!-- Centre circle + spot -->
            <circle cx="400" cy="290" r="85" fill="none" stroke="rgba(255,255,255,0.68)" stroke-width="2.5"/>
            <circle cx="400" cy="290" r="4.5" fill="rgba(255,255,255,0.8)"/>
            <!-- Far penalty area -->
            <rect x="228" y="14" width="344" height="114" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2"/>
            <rect x="320" y="14" width="160" height="48"  fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>
            <circle cx="400" cy="88" r="4" fill="rgba(255,255,255,0.62)"/>
            <!-- Far goal mouth -->
            <rect x="344" y="5" width="112" height="18" fill="rgba(255,255,255,0.07)" stroke="#fff" stroke-width="3"/>
            <!-- Far goal net -->
            <g stroke="rgba(255,255,255,0.28)" stroke-width="1">
              <line x1="360" y1="5" x2="360" y2="23"/><line x1="378" y1="5" x2="378" y2="23"/>
              <line x1="400" y1="5" x2="400" y2="23"/><line x1="422" y1="5" x2="422" y2="23"/>
              <line x1="440" y1="5" x2="440" y2="23"/>
              <line x1="344" y1="14" x2="456" y2="14"/>
            </g>
            <!-- Near penalty area -->
            <rect x="228" y="452" width="344" height="114" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2"/>
            <rect x="320" y="518" width="160" height="48"  fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>
            <circle cx="400" cy="492" r="4" fill="rgba(255,255,255,0.62)"/>
            <!-- Near goal mouth -->
            <rect x="344" y="556" width="112" height="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
            <!-- Atmospheric depth haze at far end -->
            <rect x="0" y="0" width="800" height="290" fill="url(#fog3d)"/>
            <!-- Animated ball -->
            <g class="hs-ball-3d-g">
              <circle cx="400" cy="480" r="13" fill="#f8f8f8" stroke="#1a1a1a" stroke-width="1.5"/>
              <path d="M400 471 L408 476 L405 486 L395 486 L392 476 Z" fill="#1a1a1a"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="hero-inner">
        <div class="hero-title">
          <span class="hero-logo">⚽</span>
          <div>
            <h1>Football Analyst</h1>
            <p id="heroSub" class="hero-sub">2026 World Cup · immersive prediction engine</p>
          </div>
        </div>
        <div class="hero-controls">
          <div class="ctx-switch" id="ctxSwitch" role="tablist" aria-label="Mode">
            <button class="ctx-btn" data-ctx="club" type="button">Club</button>
            <button class="ctx-btn is-active" data-ctx="international" type="button">World Cup</button>
            <span class="ctx-glow"></span>
          </div>
        </div>
      </div>
      <div class="hero-stats" id="heroStats" aria-live="polite"></div>
    </header>

    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <main class="stage" id="stage" aria-live="polite"></main>
    <footer class="foot"><span id="footStatus">Live data · ESPN + FIFA ranking · auto-trained</span></footer>
  </div>

  <!-- ── Live goal celebration overlay ── -->
  <div id="goalOverlay" class="goal-overlay" hidden aria-hidden="true">
    <div class="go-confetti" id="goConfetti"></div>
    <svg class="go-scene" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid meet">
      <g class="go-net" stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
        <path d="M380 80 L560 80 L560 280 L380 280 Z" fill="rgba(255,255,255,0.06)"/>
        <line x1="410" y1="80" x2="410" y2="280"/><line x1="440" y1="80" x2="440" y2="280"/><line x1="470" y1="80" x2="470" y2="280"/>
        <line x1="500" y1="80" x2="500" y2="280"/><line x1="530" y1="80" x2="530" y2="280"/>
        <line x1="380" y1="120" x2="560" y2="120"/><line x1="380" y1="170" x2="560" y2="170"/><line x1="380" y1="220" x2="560" y2="220"/>
      </g>
      <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="378" y1="78" x2="378" y2="282"/><line x1="378" y1="78" x2="562" y2="78"/><line x1="562" y1="78" x2="562" y2="282"/>
      </g>
      <g class="go-striker" transform="translate(120,280)">
        <ellipse cx="0" cy="8" rx="40" ry="8" fill="rgba(0,0,0,0.35)"/>
        <circle cx="0" cy="-104" r="16" fill="#0b0d12"/>
        <rect x="-14" y="-90" width="28" height="60" rx="12" fill="#0b0d12"/>
        <g class="go-arm" transform="translate(12,-84)"><rect x="-6" y="0" width="12" height="40" rx="6" fill="#12161f"/></g>
        <g transform="translate(-7,-32)"><rect x="-7" y="0" width="15" height="40" rx="7" fill="#0b0d12"/></g>
        <g class="go-leg" transform="translate(9,-32)"><rect x="-7" y="0" width="15" height="38" rx="7" fill="#0b0d12"/><rect x="-9" y="34" width="26" height="11" rx="5" fill="#7a1a2a"/></g>
      </g>
      <circle class="go-ball" cx="170" cy="292" r="14" fill="#fff" stroke="#111" stroke-width="1.5"/>
    </svg>
    <div class="go-text"><span class="go-word">GOAL!</span><span class="go-detail" id="goDetail"></span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="/v2/immersive.js?v=8"></script>
</body>
</html>
