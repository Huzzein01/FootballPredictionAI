name: Baseball safety
on:
  pull_request:
    paths: ["src/baseballModel/**", "scripts/**", "test/**", "package*.json", ".github/workflows/baseball-safety.yml"]
  push:
    branches: [agent/sportsbooks-ui-overhaul]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node --test test/*.test.js
      - run: node --check src/server.js
